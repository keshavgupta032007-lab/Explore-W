<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>International Buses | Explore-W</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/results.css">

    <script src="../javascript/init.js"></script>
</head>

<body data-service="buses">
    <header class="header">
        <div class="container nav"><a class="logo" href="index.html">✈ Explore-W</a>
            <button class="menu" id="menu">☰</button>
            <nav id="nav"><a href="flights.html">Flights</a><a href="hotels.html">Hotels</a><a
                    href="trains.html">Trains</a><a href="buses.html">Buses</a><a href="cabs.html">Cabs</a><a
                    href="packages.html">Packages</a><a href="my-trips.html">My Trips</a><a class="login"
                    href="login.html">Login</a></nav><button class="theme-toggle" id="themeToggle"
                aria-label="Toggle dark mode">☾</button>
        </div>
    </header>
    <main class="container">
        <div class="page-title">
            <h1>International Buses</h1>
            <p>Find demo intercity and cross-border coach options across Europe, Asia, UAE and USA.</p>
        </div>
        <form class="search-bar" id="quickSearch">
            <div class="search-row">
                <input name="from" placeholder="Paris / Dubai / Singapore"><input name="to"
                    placeholder="Amsterdam / Abu Dhabi / Kuala Lumpur"><input name="date" type="date"><button
                    class="btn">Search</button>
            </div>
        </form>
        <div class="layout">
            <aside class="filters">
                <h3>Filters</h3><label>Maximum price: <b id="priceLabel">₹50,000</b></label><input id="maxPrice"
                    type="range" min="500" max="50000" step="500" value="50000">
                <label><input type="checkbox"> Free cancellation</label><label><input type="checkbox"> Highly
                    rated</label><label><input type="checkbox"> Instant booking</label>
            </aside>
            <section>
                <div class="results-head"><strong id="count">0 options</strong><select id="sort">
                        <option value="priceAsc">Cheapest first</option>
                        <option value="priceDesc">Highest price</option>
                        <option value="rating">Best rated</option>
                    </select></div>
                <div id="results"></div>
            </section>
        </div>
    </main>
    <footer class="footer">
        <div class="container"><a class="logo" href="index.html">✈ Explore-W</a>
            <p>Explore More. Travel Better.</p>
        </div>
    </footer>
    <div id="toast" class="toast"></div>
    <script src="../javascript/data.js"></script>
    <script src="../javascript/results.js"></script>
    <script src="../javascript/theme.js"></script>
</body>

</html>
