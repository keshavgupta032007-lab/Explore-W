<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact Us | Explore-W</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/page.css">


  <script src="../javascript/init.js"></script>
</head>

<body>
  <div class="box">
    <button class="theme-toggle theme-toggle-corner" id="themeToggle" aria-label="Toggle dark mode">☾</button>
    <a class="logo" href="index.html">✈ Explore-W</a>
    <h1>Contact us</h1>
    <p>Question about a booking, or feedback on the site? Send a message and we'll get back to you.</p>
    <h2>Get in touch</h2>
    <form id="contact">
      <input name="name" placeholder="Name" required>
      <input name="email" type="email" placeholder="Email" required>
      <textarea name="message" placeholder="Message" required></textarea>
      <button class="btn" type="submit">Send message</button>
    </form>
    <a class="back" href="index.html">← Home</a>
  </div>
  <div id="toast" class="toast"></div>

  <script src="../javascript/theme.js"></script>
  <script src="../javascript/contact.js"></script>
</body>

</html>
